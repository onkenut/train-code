[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pointvault"
version = "0.1.0"
description = "PointVault - 三维点云标注与交互分析工具"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "PointVault Team"}
]
keywords = ["pointcloud", "annotation", "3d", "computer-vision", "lidar"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Visualization",
    "Topic :: Scientific/Engineering :: Image Recognition",
]
dependencies = [
    "PySide6>=6.5.0",
    "open3d>=0.17.0",
    "numpy>=1.24.0",
    "SQLAlchemy>=2.0.0",
    "laspy>=2.5.0",
    "plyfile>=1.0.0",
    "pypcd4>=0.4.0",
    "cachetools>=5.3.0",
    "matplotlib>=3.7.0",
    "scipy>=1.10.0",
    "scikit-learn>=1.3.0",
    "qt-material>=2.14",
    "pyyaml>=6.0",
    "Pillow>=10.0.0",
    "tqdm>=4.65.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-qt>=4.2",
    "black>=23.0",
    "isort>=5.12",
    "mypy>=1.5",
    "pyinstaller>=6.0",
]

[project.scripts]
pointvault = "pointvault.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["pointvault*"]
exclude = ["tests*", "docs*", "scripts*"]

[tool.setuptools.package-data]
pointvault = [
    "gui/styles/*.qss",
    "assets/icons/*.png",
    "assets/icons/*.svg",
    "assets/labelsets/*.json",
]

[tool.black]
line-length = 100
target-version = ['py310']

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
